package: ai_chat
version: '2.0.0'
author: 'KLXM Crossmedia GmbH'
supportpage: https://github.com/FriendsOfRedaxo/ai_chat

requires:
    php: '>=8.4'
    redaxo: '^5.20.0'

page:
    title: 'AI Chat'
    icon: rex-icon ai-chat-icon-logo
    perm: 'ai_chat[]'
    subpages:
        profiles: { title: 'Profile', perm: 'ai_chat[chatadmin]' }
        content:
            title: 'Index'
            perm: 'ai_chat[chatadmin]'
            subpages:
                overview: { title: 'Übersicht' }
                yform: { title: 'YForm-Tabellen' }
                triggers: { title: 'Trigger & Antworten' }
                cache: { title: 'Cache-Fragen' }
                retrieval_log: { title: 'Retrieval-Log' }
        statistics: { title: 'Statistik' }
        themes: { title: 'Themes', perm: 'ai_chat[chatadmin]' }        
        demo: { title: 'Demos & Beispiele', itemClass: 'pull-right' }
        settings:
            title: 'Einstellungen'
            perm: 'ai_chat[chatadmin]'
            itemClass: 'pull-left'
            subpages:
                simple: { title: 'Übersicht' }
                provider: { title: 'Provider & Parameter' }
                indexing: { title: 'Quellen' }
                behavior: { title: 'Verhalten & Antworten' }
                search: { title: 'Suche' }
                access: { title: 'Zugriff & Sicherheit' }
                retrieval: { title: 'Chunking & Cache' }
                systemcheck: { title: 'Check & Debug' }
        help: { title: 'Hilfe', subPath: README.md, itemClass: 'pull-right' }

console_commands:
    ai_chat:reindex: FriendsOfRedaxo\AiChat\Console\ReindexCommand

default_config:
    provider: gemini
    frontend_visibility: all
    ai_temperature: '0.7'
    ai_max_tokens: 2048
    openai_timeout: 120
    rag_results: 3
    rag_candidate_limit: 800
    chunk_size: 1000
    chunk_overlap: 200
    cache_similarity: '0.95'
    cache_candidate_limit: 150
    stream_enabled: false
    stats_logging_enabled: true
    live_reindex_enabled: true
    index_respect_yrewrite_seo: true
    retrieval_debug_log_enabled: false
    frontend_mode: bubble
    rate_limit: 10
    max_message_length_frontend: 2000
    max_message_length_backend: 20000
    frontend_greeting: 'Hallo! Wie kann ich Ihnen helfen?'
    frontend_prompt: 'Du bist ein hilfreicher Assistent für diese Website. Nutze den folgenden Kontext, um die Frage des Nutzers zu beantworten.'
    sources_title: 'Links:'
    position: bottom-right
    primary_color: '#007bff'
    header_bg_color: '#f8f9fa'
    chat_bg_color: '#ffffff'
    text_color: '#333333'
    bot_message_bg_color: '#f1f3f5'
    border_radius: 12
